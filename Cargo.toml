[package]
name = "whipclaude"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "whipclaude"
path = "src/main.rs"

[dependencies]
egui = "0.31"
tray-icon = "0.20"
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
enigo = "0.3"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
gtk = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[profile.release]
opt-level = 3
strip = true
